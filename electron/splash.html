<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>启动中</title>
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      overflow: hidden;
    }
    body {
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: flex-start;
      padding-top: 40px;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: #333;
      user-select: none;
    }
    .logo {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px; 
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 30px;
      color: #333;
    }
    
    /* 步骤列表样式 */
    .steps-container {
      width: 320px;
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .step-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.3s ease;
    }
    .step-item:last-child {
      border-bottom: none;
    }
    .step-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* 等待状态 */
    .step-item.pending .step-icon {
      color: #ccc;
    }
    .step-item.pending .step-label {
      color: #999;
    }
    /* 进行中状态 */
    .step-item.running .step-icon {
      color: #1890ff;
    }
    .step-item.running .step-label {
      color: #333;
      font-weight: 500;
    }
    /* 完成状态 */
    .step-item.done .step-icon {
      color: #52c41a;
    }
    .step-item.done .step-label {
      color: #52c41a;
    }
    /* 错误状态 */
    .step-item.error .step-icon {
      color: #ff4d4f;
    }
    .step-item.error .step-label {
      color: #ff4d4f;
    }
    
    .step-label {
      flex: 1;
      font-size: 14px;
      color: #666;
    }
    .step-detail {
      font-size: 12px;
      color: #999;
      margin-left: 8px;
    }
    
    /* 旋转动画 */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e0e0e0;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 底部提示 */
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 24px;
      text-align: center;
    }
    
    /* 图标样式 */
    .icon-waiting::before { content: '○'; font-size: 18px; }
    .icon-running::before { content: '●'; font-size: 18px; animation: pulse 1s ease-in-out infinite; }
    .icon-done::before { content: '✓'; font-size: 18px; font-weight: bold; }
    .icon-error::before { content: '✕'; font-size: 18px; font-weight: bold; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="logo">📄</div>
  <div class="title">WPS 公文编辑器</div>
  
  <div class="steps-container" id="stepsContainer">
    <!-- 步骤列表将通过 JavaScript 动态生成 -->
  </div>
  
  <div class="hint" id="hint">正在准备启动...</div>

  <script>
    const stepsContainer = document.getElementById('stepsContainer')
    const hintEl = document.getElementById('hint')
    let steps = []
    
    // 初始化步骤列表
    function initSteps(stepList) {
      steps = stepList
      stepsContainer.innerHTML = ''
      
      stepList.forEach(step => {
        const item = document.createElement('div')
        item.className = 'step-item pending'
        item.id = `step-${step.id}`
        item.innerHTML = `
          <div class="step-icon"><span class="icon-waiting"></span></div>
          <div class="step-label">${step.label}</div>
          <div class="step-detail"></div>
        `
        stepsContainer.appendChild(item)
      })
    }
    
    // 更新步骤状态
    function updateStep(stepId, status, detail) {
      const item = document.getElementById(`step-${stepId}`)
      if (!item) return
      
      item.className = `step-item ${status}`
      const iconEl = item.querySelector('.step-icon')
      const detailEl = item.querySelector('.step-detail')
      
      // 更新图标
      switch (status) {
        case 'pending':
          iconEl.innerHTML = '<span class="icon-waiting"></span>'
          break
        case 'running':
          iconEl.innerHTML = '<div class="spinner"></div>'
          break
        case 'done':
          iconEl.innerHTML = '<span class="icon-done"></span>'
          break
        case 'error':
          iconEl.innerHTML = '<span class="icon-error"></span>'
          break
      }
      
      // 更新详情
      if (detail) {
        detailEl.textContent = detail
      }
      
      // 更新底部提示
      if (status === 'running') {
        hintEl.textContent = detail || '请稍候...'
      } else if (status === 'done' && stepId === 'editor') {
        hintEl.textContent = '启动完成，正在进入...'
      } else if (status === 'error') {
        hintEl.textContent = '启动失败，请查看错误信息'
      }
    }
    
    // 监听主进程消息
    if (window.electronAPI) {
      // 接收步骤列表初始化
      if (window.electronAPI.onStartupInit) {
        window.electronAPI.onStartupInit((data) => {
          initSteps(data.steps)
        })
      }
      
      // 接收步骤状态更新
      if (window.electronAPI.onStartupStep) {
        window.electronAPI.onStartupStep((data) => {
          updateStep(data.stepId, data.status, data.detail)
        })
      }
      
      // 兼容旧版进度消息
      if (window.electronAPI.onStartupProgress) {
        window.electronAPI.onStartupProgress((data) => {
          if (data.stage === 'backend') {
            updateStep('engine', 'running', data.message)
          } else if (data.stage === 'frontend') {
            updateStep('editor', 'running', data.message)
          }
        })
      }
    }
    
    // 默认初始化（如果 IPC 消息还没到达）
    setTimeout(() => {
      if (steps.length === 0) {
        initSteps([
          { id: 'init', label: '初始化应用' },
          { id: 'check', label: '检查运行环境' },
          { id: 'java', label: '启动 Java 运行时' },
          { id: 'engine', label: '启动文档引擎' },
          { id: 'editor', label: '加载编辑器界面' }
        ])
      }
    }, 100)
  </script>
</body>
</html>
